[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]
solc = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
rhc = "https://robinhoodchain-mainnet-rpc.alt.technology/"
